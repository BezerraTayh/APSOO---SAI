# Perfil usado apenas para integracao com o frontend: sem login/token.
sai.integracao-sem-auth=true
sai.integracao.profissional-email=integracao@profissional.local
sai.integracao.empresa-email=integracao@empresa.local

spring.datasource.url=jdbc:postgresql://${POSTGRES_HOST:localhost}:${POSTGRES_PORT:5432}/${POSTGRES_DB:sai}
# Evita falhar se o banco ainda estiver inicializando no Docker Compose
spring.datasource.hikari.initialization-fail-timeout=-1
app.cors.origens=${APP_CORS_ORIGENS:http://localhost:5173,http://frontend:80,http://frontend:5173}

logging.level.com.trabalhoapsoo.sai=${LOG_LEVEL:DEBUG}
logging.level.org.springframework.web=${LOG_LEVEL_WEB:INFO}
